name: Demo

# Builds the fictional demo mailbox and publishes it with the viewer to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the demo mailbox (with smart search)
        run: uv run mbv build tests/fixtures/demo --slug demo --title "Parks Department (demo)" --description "A fictional mailbox for trying Mailbox Viewer"
      - name: Build the viewer for https://<owner>.github.io/<repo>/
        working-directory: viewer
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DATA_URL: /${{ github.event.repository.name }}/data
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Assemble the site
        run: |
          cp -R viewer/dist site
          cp site/index.html site/404.html   # GitHub Pages serves 404.html for /demo and other app routes
          cp -R dist site/data
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
