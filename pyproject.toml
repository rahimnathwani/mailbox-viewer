[project]
name = "mailbox-viewer"
description = "Turn mbox and PST mailboxes into a static, Gmail-style website with full-text and semantic search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahim Nathwani" }]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["mbox", "pst", "email", "foia", "public-records", "parquet", "duckdb", "static-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Database",
]
dependencies = [
    "boto3>=1.35",
    "click>=8.1",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-dotenv>=1",
    "python-pptx>=1",
    "regex>=2024.9",
    "selectolax>=0.3.21",
]

[project.urls]
Homepage = "https://github.com/rahimnathwani/mailbox-viewer"
Documentation = "https://github.com/rahimnathwani/mailbox-viewer/tree/main/docs"
Demo = "https://mail.ocaho.com/demo"
Changelog = "https://github.com/rahimnathwani/mailbox-viewer/blob/main/CHANGELOG.md"
Issues = "https://github.com/rahimnathwani/mailbox-viewer/issues"

[project.scripts]
mailbox-viewer = "mailbox_viewer.cli:main"
mbv = "mailbox_viewer.cli:main"

[dependency-groups]
dev = ["cogapp>=3.4", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mailbox_viewer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mailbox_viewer"]
exclude = ["src/mailbox_viewer/embed/node_modules"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
artifacts = ["viewer/dist/**"]  # built viewer, git-ignored but needed to build the wheel from the sdist
include = ["src/mailbox_viewer", "viewer", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "hatch_build.py"]
exclude = ["viewer/node_modules", "viewer/test-results", "viewer/playwright-report", "**/node_modules", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
